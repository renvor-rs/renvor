# Facade package. Publishable, so it carries the COMPLETE metadata set required by
# contracts/package-metadata.md — a missing field
# fails metadata validation (FR-040).
#
# `edition` and `rust-version` are INHERITED, never restated (FR-017). Restating
# either would create a second declaration site that can drift from the workspace.

[package]
name = "renvor"
description = "Facade for the Renvor framework's transport-independent kernel: application lifecycle, provider resolution, layered configuration, and health. Pre-release, unpublished, and explicitly unstable."
documentation = "https://docs.rs/renvor"
readme = "README.md"
keywords = ["renvor", "framework"]
categories = ["development-tools"]

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# The shipped file set is STATED, never inferred (FR-039). Anything not listed here
# does not reach the registry, which is what makes `cargo package --list` a
# meaningful review artifact rather than a surprise.
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

# The facade gains its first dependencies in Phase 002. The previous comment here read "No
# dependencies … declaring none is the strongest form of compliance" — true for Phase 001, and
# no longer true.
#
# Phase 001 FR-040 forbids a package intended for publication from depending on a **path-only**
# dependency. `{ path, version }` is not path-only: cargo rewrites it to the version requirement
# at publish time and drops the path. Both keys are therefore mandatory, and omitting `version`
# would breach FR-040 rather than merely inconvenience the release.
#
# `renvor-config` is OPTIONAL and gated behind the default-on `config` feature. That is the
# mechanism by which a consumer can take the core-only path and resolve none of the parser,
# derive, or secret crates — asserted with a positive control at T102, in both directions.
[dependencies]
renvor-core = { path = "../renvor-core", version = "0.0.0" }
renvor-config = { path = "../renvor-config", version = "0.0.0", optional = true }

# The REST transport, OFF by default and behind `transport-rest`. Off rather than on because the
# HTTP stack is the largest dependency set Renvor pulls, and a consumer using the kernel without a
# transport must not resolve it. Asserted in `xtask` step 7 in BOTH directions — the absence
# without the feature, and a positive control proving the same query finds the crates with it.
renvor-http = { path = "../renvor-http", version = "0.0.0", optional = true }

# The Phase 005 contracts, re-exported at the facade root under the same feature.
#
# They are declared HERE rather than reached through `renvor-http`'s re-exports because a facade
# that re-exported a re-export would tie its public surface to a transport crate's internal
# arrangement: `renvor-http` narrowing what it re-exports would silently narrow the facade.
#
# All three are `optional` and gated on `transport-rest`. `renvor-error` and `renvor-validation`
# are transport-INDEPENDENT and could reasonably be default-on, and they are deliberately not:
# nothing in the kernel-only path needs a validation boundary or a public HTTP error registry, and
# a consumer taking `default-features = false` should resolve neither. Feature isolation is
# asserted in both directions by `xtask` step 7.
renvor-error = { path = "../renvor-error", version = "0.0.0", optional = true }
renvor-validation = { path = "../renvor-validation", version = "0.0.0", optional = true }
renvor-openapi = { path = "../renvor-openapi", version = "0.0.0", optional = true }

# The Phase 010 capabilities, each OFF by default behind the feature vocabulary PLAN.md §7.4
# fixes. Every one is a port crate with a deterministic substitute; the production adapters sit
# behind the capability crate's own feature (`valkey`, `smtp`, `filesystem`, `otel`), which an
# application enables on the capability crate directly, exactly as it enables `db-postgres` on
# `renvor-sqlx`. The facade re-exports each port narrowly and never a third-party type — asserted
# by `tests/facade_boundary.rs`.
#
# `renvor-observability` is optional too, behind `observability`, because it resolves
# `tracing-subscriber` and `serde_json`, and the lean facade must keep resolving neither `serde`
# nor a subscriber stack (`xtask` step 7's lean row). `observability-otel` — the §7.4 name — turns
# on both the crate and its OTLP feature.
renvor-cache = { path = "../renvor-cache", version = "0.0.0", optional = true }
renvor-jobs = { path = "../renvor-jobs", version = "0.0.0", optional = true }
renvor-mail = { path = "../renvor-mail", version = "0.0.0", optional = true }
renvor-storage = { path = "../renvor-storage", version = "0.0.0", optional = true }
renvor-observability = { path = "../renvor-observability", version = "0.0.0", optional = true }

# Examples only. `tokio` is already in the workspace graph through `renvor-core`, so this adds a
# dependency EDGE and no new package — checked against the lockfile rather than assumed.
[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["rt", "macros"] }

# The configuration example declares a schema, which needs the derive. Already in the graph
# through `renvor-config`; this adds an edge, not a package.
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }

# The Phase 005 example declares a type whose schema drives both validation and the description.
# Already in the graph through `renvor-validation`; this adds an edge, not a package.
schemars = { version = "1.2.2", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }

# The configuration example uses `renvor::config`, which only exists when the `config` feature is
# on. Without this declaration `cargo check --no-default-features --all-targets` FAILS to compile
# it — and did, until T111. The `cargo tree` isolation check in `xtask` step 7 could never have
# caught that: resolving a graph is not compiling against it.
[[example]]
name = "configuration"
path = "examples/configuration.rs"
required-features = ["config"]

# The Phase 005 example needs the transport feature, for the same reason the configuration example
# needs `config`: without the declaration, `cargo check --all-targets` fails to COMPILE it, and a
# `cargo tree` isolation check can never catch that — resolving a graph is not compiling against it.
[[example]]
name = "described_api"
path = "examples/described_api.rs"
required-features = ["transport-rest"]

[features]
# `config` is DEFAULT-ON, so the out-of-the-box dependency footprint is the wider one and
# isolation is opt-in via `default-features = false`. Stated plainly because the reverse is
# easy to assume: this feature does not make the default build lean, it makes the lean build
# reachable.
default = ["config"]
config = ["dep:renvor-config"]

# The first real transport. Deliberately NOT in `default`: enabling a transport is a decision, and
# a consumer who has not made it should not pay for it in build time, binary size, or audit surface.
transport-rest = [
    "dep:renvor-http",
    "dep:renvor-error",
    "dep:renvor-validation",
    "dep:renvor-openapi",
]

# The Phase 010 capabilities (PLAN.md §7.4). Each is a DECISION and is off by default; a build
# that does not enable one resolves none of its crates — asserted by `xtask` step 7 with a mirror
# control per feature.
capability-cache = ["dep:renvor-cache"]
capability-jobs = ["dep:renvor-jobs"]
capability-mail = ["dep:renvor-mail"]
capability-storage = ["dep:renvor-storage"]
observability = ["dep:renvor-observability"]
observability-otel = ["observability", "renvor-observability/otel"]

[lints]
workspace = true
