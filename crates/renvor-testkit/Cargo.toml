# Failure injection and deterministic time control for testing Renvor applications
# (spec FR-030, FR-031).
#
# `publish = true` is REQUIRED here, not merely permitted. Plan DAG property 4 has authors add
# this crate under `[dev-dependencies]` — that is the only way FR-030's harness reaches a user's
# tests without reaching their binaries. A `publish = false` crate cannot be depended on at all,
# so marking it unpublishable would make the harness undeliverable.
#
# Nothing in `renvor`, `renvor-core`, or `renvor-config` depends on this crate. That direction is
# what keeps `test-util` out of every production graph, and it is asserted at T101.

[package]
name = "renvor-testkit"
description = "Test harness for Renvor applications: lifecycle failure injection at every phase, and deterministic time control without real elapsed time."
documentation = "https://docs.rs/renvor-testkit"
readme = "README.md"
keywords = ["renvor", "testing", "harness"]
categories = ["development-tools::testing"]
publish = true

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

include = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
renvor-core = { path = "../renvor-core", version = "0.0.0" }

# The AUTHENTICATION ports and value types, for the refresh-rotation contract. Optional and behind
# `tokens`, so a consumer measuring only the persistence contract resolves neither this crate's
# auth half nor the JWT backend behind it.
renvor-auth = { path = "../renvor-auth", version = "0.0.0", optional = true }

# The instant type the refresh contract compares. Optional for the same reason.
chrono = { version = "0.4.45", default-features = false, features = [
    "std",
    "clock",
], optional = true }

# The JOBS port and value types, for the shared job-store contract. Optional and behind `jobs`,
# so a consumer measuring only the persistence contract resolves neither.
renvor-jobs = { path = "../renvor-jobs", version = "0.0.0", optional = true }

# The persistence PORTS, so `persistence.rs` can host the contract every adapter is measured
# against. Ports only — this crate names no driver, and depends on neither adapter, so hosting the
# shared suite does not put SQLx or SeaORM into anyone's graph.
renvor-database = { path = "../renvor-database", version = "0.0.0" }
renvor-http = { path = "../renvor-http", version = "0.0.0", optional = true }
# The loopback HTTP client generated tests drive a spawned starter with (Phase 011, package
# research §3): ISC, zero dependencies, chunked responses and timeouts handled. Never an
# `https-*` feature — `native-tls` is banned and `https-rustls` would pull `aws-lc-rs`.
minreq = { version = "3.0.0", default-features = false, optional = true }

# `test-util` is a NORMAL dependency here and only here. This crate is itself a testing tool, so
# time control is its product rather than a test convenience — an author consumes it under
# `[dev-dependencies]`, which is what keeps it out of production binaries (FR-031).
tokio = { version = "1.53.1", default-features = false, features = ["rt", "time", "sync", "macros", "test-util"] }

# Capturing subscriber for assertions about emitted records. `json` and `ansi` are excluded.
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter"] }

tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["rt", "rt-multi-thread", "time", "sync", "macros", "test-util"] }

[features]
default = []

# The AUTHENTICATION contracts that need no token mode: the abuse-control suite. Split out from
# `tokens` so a consumer measuring abuse controls does not resolve `jsonwebtoken` or `aws-lc-sys`
# — the native build behind them is exactly what `renvor-auth`'s `tokens` flag exists to keep
# optional, and folding the two features together here would have undone that from the test side.
auth = ["dep:renvor-auth", "dep:chrono"]

# The refresh-rotation contract. Names `renvor-auth`'s `tokens` half, which is where the JWT
# dependency lives — so a build without this feature resolves no `jsonwebtoken` through this crate.
tokens = ["auth", "renvor-auth/tokens"]

# The shared job-store contract (Phase 010). Names `renvor-jobs`, which names no driver.
jobs = ["dep:renvor-jobs"]
# The socket-free test application (Phase 011): dispatches requests through a route registry.
http = ["dep:renvor-http"]
# The blocking loopback client for tests that spawn a binary (Phase 011).
client = ["dep:minreq"]

[lints]
workspace = true
