# The transport-independent validation boundary (Phase 005).
#
# # One declaration, two consumers — the same structure the route registry uses
#
# A constraint is declared ONCE, as a schema. Runtime validation interprets that schema; the
# OpenAPI document embeds that schema. "Runtime validation and published schemas agree" is
# therefore an IDENTITY rather than a property tests have to chase — the same argument
# `contracts/http-routing.md` makes for routes, applied to input rules.
#
# # Why Renvor interprets the schema instead of using a JSON Schema validator at runtime
#
# MEASURED, not estimated. The figures below are a snapshot; the command is the durable part:
#
#     cargo tree -p renvor-http --edges normal    # the transport's runtime graph
#     cargo tree -p jsonschema                    # what the reference validator carries
#
# On 2026-09-01, at jsonschema 0.52.1, that is 77 packages against 65, of which 44 are not already
# in the transport's graph. Validating a request body against its own schema with `jsonschema` would
# therefore grow the transport's dependency surface by more than half, to carry fancy-regex,
# num-bigint, uuid-simd and email_address that runtime validation has no use for. Constitution
# principle XII requires "the smallest design satisfying the contract", and PLAN.md §22 names
# dependency cost as a tracked program risk.
#
# The exact ratio moves with both graphs and is not the argument; the direction is, and it has held
# at every measurement. Recording it this way also keeps the note honest when the number improves:
# 0.52.1 gates `idn-hostname` and `idn-email` behind a new `idna` feature, which removed the entire
# ICU stack (icu_normalizer, icu_properties, icu_collections, icu_provider) and wasm-bindgen from
# this graph. An earlier revision of this note listed those as part of the cost, and they are no
# longer in it. Renvor does not enable `idna` — it treats `format` as an annotation, so it has
# nothing to assert with.
#
# So Renvor interprets a BOUNDED, DECLARED subset of JSON Schema — and `jsonschema` is a
# DEV-dependency, where its weight is free, used for DIFFERENTIAL TESTING: for generated
# schema/instance pairs, Renvor's verdict must equal the reference implementation's. That is what
# stops the bounded interpreter from quietly diverging from the standard it publishes.
#
# # Why not `validator` or `garde`
#
# Both validate. NEITHER emits a JSON Schema. `schemars` emits a JSON Schema and does not validate.
# Using one of each declares every constraint TWICE, which is precisely what FR-007 forbids and
# what turns this phase's central acceptance criterion into a test instead of an identity.
#
# See ADR-0014 and the Phase 005 dependency inventory.
#
# `edition` and `rust-version` are INHERITED and must never be restated (ADR-0002).

[package]
name = "renvor-validation"
description = "Transport-independent validation boundary for the Renvor framework: one schema declaration drives both runtime enforcement and published API description, with issues that identify inputs without quoting them."
documentation = "https://docs.rs/renvor-validation"
readme = "README.md"
keywords = ["renvor", "framework", "validation", "json-schema"]
categories = ["web-programming"]
publish = true

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# The shipped file set is STATED, never inferred (Phase 001 FR-039).
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]

[dependencies]
# The issue vocabulary, and the Problem Details types an issue becomes. This crate produces
# `InvalidParam` values; it does not know how they reach a caller.
renvor-error = { path = "../renvor-error", version = "0.0.0" }

# Schema PRODUCTION. Emits JSON Schema draft 2020-12 — measured by running `schema_for!` and
# reading the emitted `$schema` — which is the exact dialect base OpenAPI 3.2 declares. Its output
# was verified to embed as a VALID OAS 3.2 Schema Object against the official schema.
#
# `default-features = false` plus `derive`: net new packages measured against the existing
# lockfile are SEVEN — schemars, schemars_derive, serde_derive_internals, dyn-clone, ref-cast,
# ref-cast-impl, zmij. Compare 44 for the runtime-validator alternative above.
schemars = { version = "1.2.2", default-features = false, features = ["derive"] }

serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }

# Page-cursor encoding ONLY. A cursor is opaque, so its encoding is not a public contract — but it
# must be URL-safe and stable, and `base64` is the maintained implementation of exactly that.
# `default-features = false` keeps `std`'s allocator behaviour explicit.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }

[dev-dependencies]
# THE REFERENCE IMPLEMENTATION, dev-only.
#
# The graph measured at the top of this manifest is the reason it is not a runtime dependency, and
# its correctness is the reason it is a dev one: Renvor's bounded interpreter is asserted to agree
# with it over generated schema/instance pairs. A bounded subset that disagrees with the standard
# it publishes is worse than no subset, and this is how that is caught rather than assumed.
jsonschema = { version = "0.52.1", default-features = false }

# Cursor decoding must not panic on ANY input, and a cursor is untrusted. PLAN.md §17.1 names
# "property or fuzz tests for parsers, routing edge cases, pagination cursors, and untrusted
# formats" — this is that requirement's tooling.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }

[lints]
workspace = true
