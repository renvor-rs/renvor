# The `renvor` executable and its transactional project generator (Phase 003).
#
# # The package is `renvor-cli`; the EXECUTABLE is `renvor`
#
# Those are separate facts and both are normative. ADR-0010 makes the installed executable's name
# a **compatibility promise** — it is the string a user types and a shell resolves — so `[[bin]]`
# below is not a convenience, it is the contract. `xtask` asserts it, with a control.
#
# The package cannot also be called `renvor`: `crates/renvor` is the library facade and already
# holds that name.
#
# `edition` and `rust-version` are INHERITED and must never be restated (ADR-0002).
#
# `publish = false`, deliberately and unlike every other member. Phase 003 ships no release, and
# `PLAN.md` §19.2 puts the first publication far later. A package marked publishable that nobody
# has rehearsed publishing is a claim without evidence.

[package]
name = "renvor-cli"
description = "The `renvor` command-line interface: interactive project generation, environment diagnostics, and local development workflow."
readme = "README.md"
publish = false

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# THE CONTRACT. Renaming this breaks every installed user's muscle memory and every script.
[[bin]]
name = "renvor"
path = "src/main.rs"

[dependencies]
# The database VOCABULARY only — names and dialect helpers, no driver and no pool. The CLI needs
# to parse `--database` into the same type the runtime uses, so that a generated `renvor.toml`
# cannot name a database the runtime will not recognise.
renvor-database = { path = "../renvor-database", version = "0.0.0" }
renvor-core = { path = "../renvor-core", version = "0.0.0" }
renvor-config = { path = "../renvor-config", version = "0.0.0" }

# The Phase 003 research record is a working artifact and is no longer tracked. It remains in
# public Git history at:
# https://github.com/renvor-rs/renvor/blob/01327b1ee61b73ebbd4f9198c04d651b38367ba8/specs/003-interactive-cli/research.md
# Every "Phase 003 research §Dn" below is a section of that document.
#
# Phase 003 research §D1 — argument parsing. `derive` because the flag surface IS the contract and one
# declaration keeps help, validation, and completions from drifting apart. `wrap_help` so `--help`
# is readable at a narrow width, which the spec's edge cases require.
#
# `color` IS THE FEATURE THAT MAKES `--help` STYLEABLE AT ALL, and it was deliberately absent until
# now. Without it clap ignores `Command::styles` entirely, so the help renderer emitted plain text
# no matter what was configured — which was correct while there was no styling to configure. It
# pulls `anstream` into the runtime graph; `anstream` was already in `Cargo.lock` as a dev-only
# dependency of `trycmd`, so this adds an edge rather than a package.
#
# The renderer stays clap's. C-8 requires the *content* of `--help` to be clap's own generated
# usage, options, and descriptions; only the colours are ours. Replacing the renderer with
# handwritten strings would let the documented surface drift from the parsed one.
clap = { version = "4.6.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "wrap_help", "color"] }

# THE GUIDED PROMPT PRESENTATION. This replaced `inquire` on 2026-08-21.
#
# Phase 003 research §D2 chose `inquire` over `dialoguer` because `InquireError` distinguishes
# `OperationCanceled`, `OperationInterrupted`, and `NotTTY` as separate typed outcomes — which is
# what let cancellation exit 4 without inferring intent from an I/O error kind. That property is
# the one this swap had to preserve, and it is the reason the swap was measured before it was made
# rather than after.
#
# `cliclack` returns `io::Result<T>` rather than a typed enum, which looks weaker on paper. It is
# not, because the two outcomes that matter arrive as **distinct, deliberate** `io::ErrorKind`s
# rather than as one generic failure:
#
#   Ctrl-C, Escape  ->  ErrorKind::Interrupted   ->  Code::Cancelled  (exit 4)
#   no terminal     ->  ErrorKind::NotConnected  ->  Code::Usage      (exit 2)
#   anything else   ->  ErrorKind::*             ->  Code::Internal   (exit 1)
#
# **That table was measured, not read.** A prototype outside this tree drove the real crate through
# a `portable-pty` terminal on Rust 1.94.0 and recorded the kind for every case, including that
# **Escape cancels** — `interaction.rs` contains an Escape/Cancel toggle whose presence made that
# worth proving rather than assuming. It also proved the cursor is restored (`\x1b[?25h`) after
# success, after a validation failure, and after cancellation; that prompts land on `stderr` with
# **zero** bytes on `stdout`; and that `NO_COLOR` and `TERM=dumb` suppress colour. The equivalent
# assertions now live in `tests/prompt_contract.rs` against the shipped binary, so the finding is a
# gate rather than a memory.
#
# **It declares no `rust-version`, and that is a real cost**, not one to gloss: §D11 rejected
# `blake3` for exactly this. It is accepted here on stronger evidence than a declaration — a clean
# compile on 1.94.0, **locked** by the committed `Cargo.lock` that CI resolves with `--locked`, and
# re-measured by the MSRV leg of CI on every pull request. A declaration is a promise; the MSRV job
# is a measurement.
#
# **"Locked", not "pinned to an exact version"** — the requirement is a caret, as it is for every
# other dependency here, and `deny.toml` forbids wildcards rather than carets. An earlier version
# of this comment said "pinned", which claimed a stronger mitigation than the manifest provides. A
# `cargo update` could take 0.5.7 and raise the real MSRV silently; what catches that is the MSRV
# job, not this line.
#
# `indicatif` arrives underneath this crate whether or not we call it, so the progress adapter
# below costs no additional package.
cliclack = "0.5.6"

# DIRECT because Renvor's colour policy must OVERRIDE this crate's own environment sniffing.
#
# `console` decides colour from `CLICOLOR_FORCE`, `CLICOLOR`, and `NO_COLOR` by itself, and
# `cliclack` draws through it. Left alone, `CLICOLOR_FORCE=1 renvor new --no-color` would produce
# unstyled Renvor output next to styled prompts — one process disagreeing with itself about a flag
# the operator set explicitly. `output::style` therefore resolves the question once and calls
# `console::set_colors_enabled_stderr` with the answer, which is only reachable from a direct
# dependency edge. Already in the graph via `cliclack`: an edge, not a package.
console = { version = "0.16.4", default-features = false }

# Progress for the ONE operation long enough to need it: `generate::verify::in_staging`, which runs
# five `cargo` invocations with `.output()` — fully captured — against a cold target directory.
# That is tens of seconds during which a `renvor new` printed one static line and then nothing.
#
# `renvor dev` deliberately gets none: it hands `cargo` the terminal (`Reporter::child_stdout`
# returns `inherit()` in human mode), so a spinner would render on top of cargo's own bar.
#
# Already in the graph via `cliclack`, so this is an edge rather than a package.
indicatif = { version = "0.18.6", default-features = false }

# Phase 003 research §D4 — templating. Selected for three properties this phase requires as CONFIGURATION
# rather than convention: bounded expansion, an allow-listed function set, and strict undefined.
#
# `fuel` IS THE BOUNDED-EXPANSION FEATURE, AND IT IS NOT ON BY DEFAULT. It is absent from
# MiniJinja's `default` set, so FR-026's bound exists only because this line enables it. That is
# worth stating: a bound nobody enabled is a bound that does not exist, and the difference is one
# word in a manifest. `crates/renvor-cli/tests/bounds.rs` asserts the bound rather than trusting
# this declaration.
#
# `default` is off so that `debug`, `deserialization`, `macros`, `multi_template`,
# `adjacent_loop_items`, and `std_collections` stay out — each is a template capability this phase
# has no use for, and constitution VI wants deny-by-default.
minijinja = { version = "2.24.0", default-features = false, features = ["builtins", "fuel", "serde"] }

# Phase 003 research §D5 — the staging directory. The transaction itself is composed here from `tempfile`
# and `std::fs::rename`, because no maintained crate provides DIRECTORY-level transactional
# placement; the two that sound like it are file-level. That finding is recorded, not glossed.
tempfile = { version = "3.27.0", default-features = false }

# Phase 003 research §D6 (revision 2) — THE DESTINATION BOUNDARY, AND IT IS STRUCTURAL RATHER THAN CHECKED.
#
# Every filesystem operation the generator performs goes through a `cap_std::fs::Dir` handle opened
# once on the destination's parent. Inside a handle, traversal, absolute-path injection, and
# symlinks that leave the tree are refused by the library — not by a check this program remembers
# to call. A code path that forgets to validate cannot escape, because there is no ambient path API
# in scope to escape with.
#
# The first revision of D6 rejected this crate and required an ADR to justify hand-composed
# containment instead. That rejection was reversed on measured evidence rather than on preference;
# the measurements are in Phase 003 research §D6.
#
# It also replaces `walkdir` for the manifest walk: a `Dir`-relative recursive read_dir gives
# deterministic traversal AND containment, where walkdir gave only the first.
#
# SECURITY FLOOR. 4.0.3 is the patched release for GHSA-hp8f-xmx4-4qrg (critical, CVSS 3.1 9.0):
# `manually::open` re-appended a trailing slash before `openat`, and on Unix a trailing slash makes
# the kernel treat the final component as non-final and follow the symlink, defeating `O_NOFOLLOW`
# and escaping the sandbox this crate is depended on to provide. `Cargo.lock` already resolved 4.0.3,
# but a lockfile is not a policy: `"4.0.2"` means `>=4.0.2, <5.0.0`, so a re-resolve could legally
# reintroduce the vulnerable version. The floor is the part that forbids it.
cap-std = { version = "4.0.3", default-features = false }

# THE SEMANTIC STYLE VOCABULARY. `anstyle::Style` is a value, not a writer: it carries a colour and
# an effect and knows how to render its own on/off sequences, which is exactly the boundary
# `output::style` needs. Nothing in this crate writes a raw escape sequence.
#
# Already in `Cargo.lock` via `clap_builder`, so this is a direct edge and not a new package.
anstyle = { version = "1.0.14", default-features = false }

# THE PORTABLE WAY TO ACTUALLY WRITE THOSE SEQUENCES, and the belt to the policy's braces.
#
# `AutoStream::new(stream, ColorChoice::Never)` **strips** ANSI from whatever is written through
# it. `output::style` resolves the policy and hands the result down as an explicit `ColorChoice`,
# so on every path that forbids styling — JSON, a pipe, `TERM=dumb`, `--no-color`, `NO_COLOR` —
# an escape sequence that leaked from anywhere is removed at the boundary rather than emitted.
# The tests assert the absence; this is what makes the absence structural.
#
# `wincon` is why this crate is used rather than `writeln!`: on Windows it translates to console
# API calls where virtual-terminal processing is unavailable, which no amount of care with
# `format!` can do. Already in `Cargo.lock` via `trycmd`; this promotes it to a runtime edge.
#
# **`auto` is deliberately NOT enabled.** It gates `ColorChoice::Auto`, which resolves the question
# by sniffing the stream — and `output::style` has already answered it. Every `AutoStream` in this
# crate is built with an explicit `Always` or `Never`, so the feature would buy a code path nothing
# takes. Verified rather than assumed: `grep ColorChoice::` finds only those two, and the binary
# builds in a clean target directory without it. Constitution VI wants deny-by-default, and an
# advisory review asked the question.
anstream = { version = "1.0.0", default-features = false, features = ["wincon"] }

# DISPLAY width, which is not `len()` and not `chars().count()`.
#
# The dotted-leader rows align a value to the right edge, so a wrong width is a visibly broken
# column. `日本語` is three characters and six columns; a combining acute is one character and zero
# columns. Package-first over a hand-rolled table: the East Asian Width property is a Unicode data
# file that changes with each release, and owning a copy means owning its updates forever.
#
# Already in `Cargo.lock` — it arrived via `inquire`, which this change removes, so this edge is
# what keeps it in the graph.
unicode-width = { version = "0.2.2", default-features = false }

# How wide the terminal actually is, per stream. `terminal_size_of` takes the handle rather than
# assuming `stdout`, which matters because the human result and the diagnostics go to different
# streams and either one may be redirected on its own.
#
# Already in `Cargo.lock` via `clap_builder`'s `wrap_help`.
terminal_size = { version = "0.4.4", default-features = false }

# Phase 003 research §D10 — the machine-readable output contract.
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }

# Phase 003 research §D11 — content identity in the manifest. SHA-256 because it is what the rest of this
# project already uses for artifact identity; a second algorithm would mean two vocabularies for
# one idea. `blake3` was rejected for declaring no MSRV.
sha2 = { version = "0.11.0", default-features = false, features = ["alloc"] }  # `oid` deliberately off: ASN.1 identifiers are not needed here

# The project manifest format. Already in the resolved graph via `renvor-config`.
toml = { version = "1.1.4", default-features = false, features = ["parse", "display", "serde"] }

# Version comparison for `renvor doctor` (FR-032, T065). Already in the resolved graph — cargo's own
# ecosystem depends on it — so this adds a direct edge rather than a crate.
#
# Package-first over a hand-written `split('.')` comparison, which is the classic place an
# off-by-one lives: `1.94.0` versus `1.100.0` compares wrongly under string ordering, and
# pre-release suffixes (`1.94.0-nightly`) need rules this crate already implements and tests.
semver = { version = "1.0.28", default-features = false }

# Bounded waits for the container-runtime probe (FR-035, T071). `std::process` offers no way to
# wait with a deadline, and `docker info` is the one call in this program that can block forever:
# a stale socket, or a Docker Desktop still starting, answers neither yes nor no.
#
# Package-first over a thread-plus-channel of our own. The obvious hand-rolled version leaks the
# waiting thread and the child process when it gives up, which turns a hang into a hang plus a
# zombie. 49.7M downloads a month; already in the resolved graph via the test harness.
#
# SECOND USE, Phase 005 (FR-053): the project-binary relay in `commands/relay.rs`. `renvor routes`
# used a blocking `Command::output()` and recorded the consequence in its own source — a project
# binary that ignores the invocation, boots, and streams logs forever was an unbounded wait. The
# same crate answers both, so there is one bounded-wait mechanism in this program rather than two
# that can drift.
wait-timeout = { version = "0.2.1", default-features = false }

[dev-dependencies]
# Phase 003 research §D14 — the command surface is a public contract, so it is tested as expected OUTPUT
# rather than as assertions buried in Rust. A contract change then appears as a diff in review.
trycmd = { version = "1.2.1", default-features = false, features = ["color-auto", "diff", "filesystem", "examples"] }

# An INDEPENDENT check that generated manifests are valid TOML. `renvor check` uses the same
# parser the generator does, so a bug in how we emit could in principle be matched by a bug in how
# we read; parsing the output with a plain `toml::Value` closes that.
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
tempfile = { version = "3.27.0", default-features = false }
portable-pty = { version = "0.9.0", default-features = false }

# Phase 003 research §D14 — structured snapshots. `trycmd` records the command surface as byte-exact
# expected output; this records the SHAPE of every JSON document, which is a different contract.
# A value changing is not a schema change, and a test that cannot tell the two apart either breaks
# on every unrelated edit or notices neither.
insta = { version = "1.48.0", default-features = false, features = ["json"] }

# THE PSEUDO-TERMINAL'S OWN MODE, WHICH IS THE ONLY DETERMINISTIC READINESS SIGNAL A PROMPT TEST HAS.
#
# `console` puts the terminal into raw mode INSIDE its one-key read and restores it on the way out,
# so "the prompt is drawn" is written before raw mode begins rather than after. Waiting on drawn
# text therefore proves nothing about whether Ctrl-C will arrive as a key or as a SIGINT, which is
# what made `control_c_at_a_prompt_is_a_cancellation` flake on three separate CI runs.
#
# A pty's `termios` is one kernel object shared by both ends, so the master end can ask what mode
# the slave is in. `portable-pty` already exposes that as `MasterPty::get_termios`, and it hands
# back `nix`'s own type — so the version here is PINNED TO THE ONE `portable-pty` 0.9.0 depends on.
# A different major would compile as a second, unrelated `Termios` and the flag sets would not
# match.
#
# `libc` was tried first and rejected: this workspace builds with `-F unsafe-code`, and every
# `tcgetattr`/`tcsetattr` in `libc` needs an `unsafe` block. `nix` wraps the same calls safely.
#
# # Why it is target-gated
#
# `termios` is POSIX. `MasterPty::get_termios` is itself `#[cfg(unix)]`, and so is every caller in
# `tests/harness/mod.rs`, so on Windows this crate would be compiled for nothing. The readiness
# probe has no Windows counterpart — ConPTY exposes the console mode to the child, not to whoever
# holds the other end — and `Terminal::await_input_readiness` records that gap rather than hiding
# it.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.28.0", default-features = false, features = ["term"] }

[lints]
workspace = true
