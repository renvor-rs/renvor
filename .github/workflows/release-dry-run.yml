# Non-publishing release rehearsal.
#
# This workflow exercises the release procedure in RELEASING.md up to, and never
# including, publication. It is STRUCTURALLY incapable of publishing:
#
#   * the top-level permission is `contents: read`;
#   * no job is granted `contents: write` or `packages: write`;
#   * no registry token is referenced, and none exists to reference;
#   * the only `cargo publish` invocation carries `--dry-run`;
#   * it creates no tag, no GitHub Release, and no container image.
#
# The permission boundary is a control, not a convenience. Widening it to make a future
# task easier would remove the only reason this workflow is safe to run at all.
#
# Publication itself is out of scope for this phase and for this file. When it happens it
# will be a separate workflow, gated by the protected release environment (RELEASING.md
# §7) and using trusted publishing (§5) — never a token stored here.

name: release-dry-run

on:
  # Manual rehearsal. This is how the release approver exercises the procedure without
  # any part of it reaching the registry.
  workflow_dispatch:
  # Runs on changes that could alter what would ship, so a packaging regression is caught
  # in review rather than during a release.
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/release-dry-run.yml"

# Least privilege. Read is all the packaging job needs; only the attestation job elevates,
# and only to the two scopes the attestation actions document as required.
permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

env:
  # The publishable set, in PUBLICATION ORDER — dependencies before dependents.
  #
  # Phase 001 had exactly one publishable package and rehearsed it with `-p renvor`. Phase 002
  # gives the facade its first dependencies, and that single-crate form then becomes IMPOSSIBLE,
  # not merely suboptimal: `cargo publish -p renvor --dry-run` fails with "no matching package
  # named `renvor-core` found, location searched: crates.io index", because the dependency does
  # not exist on the registry yet. Marking the dependencies publishable does NOT fix it — the
  # failure is about registry presence, not about the `publish` flag.
  #
  # `cargo publish --dry-run --workspace` DOES work: cargo stages the workspace members into a
  # temporary registry and verifies the whole chain. It requires every member in the chain to be
  # publishable, which is why renvor-core, renvor-config, renvor-http, and renvor-testkit are all
  # `publish = true`.
  #
  # `xtask` declares `publish = false` and is excluded automatically by the workspace commands, and
  # so does `renvor-cli` — verified: the dry run uploads the crates named below and no others.
  #
  # See the Phase 002 research record §D13 for the four-case experiment, and proposed ADR-0008:
  # https://github.com/renvor-rs/renvor/blob/01327b1ee61b73ebbd4f9198c04d651b38367ba8/specs/002-core-kernel/research.md
  #
  # ── PHASE 004: FOUR CRATES BECAME FIVE ──────────────────────────────────────────────
  #
  # `renvor-http` was added, and the assertion below **failed on the first push** with:
  #
  #   expected: renvor renvor-config renvor-core renvor-testkit
  #   actual:   renvor renvor-config renvor-core renvor-http renvor-testkit
  #
  # That is the guard working. It is a **pinned list precisely so that growing the publishable set
  # is a decision somebody records**, rather than a consequence of adding a crate — and the fix it
  # asks for is this line, not a weakening of the check.
  #
  # `renvor-http` is `publish = true` because ADR-0008 records, by experiment, that a publishable
  # package cannot depend on an unpublishable one, and the facade depends on it behind the
  # off-by-default `transport-rest` feature. **A default-OFF optional dependency still has to be
  # publishable**: `--dry-run` resolves every optional dependency regardless of its feature.
  #
  # ── PHASE 005: FIVE CRATES BECAME EIGHT ─────────────────────────────────────────────
  #
  # `renvor-error`, `renvor-validation`, and `renvor-openapi` were added, and this assertion
  # **failed on the first push of that branch** with:
  #
  #   expected: renvor renvor-config renvor-core renvor-http renvor-testkit
  #   actual:   renvor renvor-config renvor-core renvor-error renvor-http renvor-openapi renvor-testkit renvor-validation
  #
  # The guard working again, for the same reason and to the same effect.
  #
  # All three are publishable for the forced reason ADR-0008 records: `renvor-http` adapts all
  # three, and `renvor-http` is itself forced by the facade. `renvor-error` is the interesting one
  # — it depends on **no Renvor crate at all**, so it publishes at position 1 beside the kernel.
  #
  # ── PHASE 007: TEN CRATES BECAME ELEVEN ─────────────────────────────────────────────
  #
  # (Newest first. The blocks below run backwards through the phases.)
  #
  # `renvor-seaorm` was added. It publishes AFTER `renvor-database`, whose ports it implements, and
  # it is deliberately NOT after `renvor-sqlx`: the two adapters are siblings and neither depends
  # on the other, which is what keeps a SeaORM application's graph free of a direct-SQLx crate.
  #
  # `renvor-testkit` MOVED, from before `renvor-validation` to after `renvor-database`. It now
  # depends on `renvor-database`, because it hosts the shared persistence contract both adapters
  # are measured against, and a dependency must publish first.
  #
  # AND SO DID `renvor-database`, WHICH THIS BRANCH FIRST GOT WRONG.
  #
  # Making room for `renvor-testkit` moved `renvor-database` from position 6 to 4 — past
  # `renvor-validation`, which it depends on. The list then claimed a publication order that
  # cannot publish: `cargo publish` would have failed on `renvor-database` with a
  # missing-`renvor-validation` registry error that reads like a network fault.
  #
  # THE ASSERTION BELOW DID NOT CATCH IT, and could not: it `sort`s both sides before comparing,
  # so it checks MEMBERSHIP and says nothing about order. A dependency review found it. Order is
  # now asserted topologically in `xtask`, against `cargo metadata` rather than against this
  # comment — see `publication_order_is_topological`.
  #
  # ── PHASE 006: EIGHT CRATES BECAME TEN ──────────────────────────────────────────────
  #
  # `renvor-database` and `renvor-sqlx` were added, and this assertion **failed on the first push
  # of that branch** with:
  #
  #   expected: renvor renvor-config renvor-core renvor-error renvor-http renvor-openapi renvor-testkit renvor-validation
  #   actual:   renvor renvor-config renvor-core renvor-database renvor-error renvor-http renvor-openapi renvor-sqlx renvor-testkit renvor-validation
  #
  # The guard working a third time, for the same reason and to the same effect. Recorded here in
  # the same form as the two above, because the value of this line is the history of decisions it
  # has forced, not the list itself.
  #
  # These two are publishable for a DIFFERENT reason from the Phase 004 and 005 additions, and the
  # difference matters. Those were **forced**: the facade reaches them, and ADR-0008 records by
  # experiment that a publishable package cannot depend on an unpublishable one. The facade does
  # **not** depend on `renvor-database` or `renvor-sqlx` — persistence is deliberately outside it,
  # so a project that wants no database resolves no driver.
  #
  # They are publishable because an application depends on them **directly**. `renvor-database`
  # declares the ports an application writes its repositories against, and `renvor-sqlx` is the
  # adapter it names in its own `Cargo.toml` with one driver feature. A framework whose persistence
  # ports could not be depended on would have no persistence story at all.
  #
  # `renvor-testkit` MOVED AGAIN in batch G2, from before `renvor-auth` to after it. The four-row
  # refresh contract is a shared suite, and every other shared suite in this workspace lives in
  # `renvor-testkit` — so that crate now has an OPTIONAL `renvor-auth` dependency behind its own
  # `tokens` feature. `publication_order_is_topological` builds each tree with `--all-features`, so
  # the optional edge is a real edge to it, and the previous order would have published
  # `renvor-testkit` before the crate it resolves. This is the fourth time this line has caught an
  # ordering a `--dry-run` would have reported green.
  #
  # Listed below in PUBLICATION order (see RELEASING.md). The comparison does not require it — it
  # sorts both sides — but it makes the line readable as the thing it describes.
  CRATES: "renvor-core renvor-error renvor-config renvor-validation renvor-database renvor-auth renvor-testkit renvor-sqlx renvor-seaorm renvor-openapi renvor-http renvor-auth-http renvor"
  # The facade, still named separately: it is the crate whose SBOM is the meaningful one for a
  # consumer, because it is the package users actually depend on.
  FACADE: renvor

jobs:
  rehearse:
    name: package and verify without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Inherits the top-level `contents: read`. Do not add a `permissions:` block here.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The declared MSRV, RESTATED here.
      #
      # CORRECTED 2026-08-16 (T137). This comment previously claimed the version was "taken
      # from rust-toolchain.toml rather than restated here". It is not: passing `toolchain:`
      # to this action overrides the file entirely, so the literal below IS the second
      # declaration site the old comment said did not exist. The claim was the reverse of
      # the mechanism, which is worse than no comment — it told a reader updating the MSRV
      # that this file needed no edit.
      #
      # Stated as it actually is: NOTHING currently verifies that this literal, the
      # `channel` in rust-toolchain.toml, and `rust-version` in Cargo.toml agree. Moving the
      # MSRV means editing all three by hand, and a run that edits only two will not fail
      # here. Omitting this input entirely would make the action read rust-toolchain.toml
      # and remove the drift, at the cost of a rehearsal that follows the file wherever it
      # goes. Neither is free; the current state is the restatement, unchecked.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: "1.94.0"

      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-cyclonedx

      # Every generated artifact lands OUTSIDE the checkout. Build products in the source
      # tree are how a later run packages something the previous run left behind, and how
      # a cleanliness assertion turns into noise that gets suppressed.
      #
      # CORRECTED 2026-08-16 (T120). This step previously set only REHEARSAL_DIR, and the
      # claim above was FALSE: `cargo package` and `cargo publish --dry-run` write their
      # archives and verification builds to `target/`, which is inside the checkout. The
      # artifacts were then COPIED out of the checkout at the end, which is a different
      # thing from never being written into it.
      #
      # CARGO_TARGET_DIR is what actually makes the claim true.
      #
      # Set here rather than in a workflow-level `env:` block: the `runner` context is not
      # available at workflow or job level, only at step level. $RUNNER_TEMP is the plain
      # environment variable the runner always exports, so it works in any `run` shell.
      - name: Locate every generated directory outside the checkout
        run: |
          set -euo pipefail
          {
            echo "REHEARSAL_DIR=${RUNNER_TEMP}/rehearsal"
            echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/target"
          } >> "$GITHUB_ENV"

      # The baseline for the cleanliness assertion at the end.
      #
      # A plain file listing, taken with `find` and NOT with git. `git status --porcelain`
      # consults .gitignore, so it is structurally incapable of seeing a generated file in
      # an ignored directory — which is the exact class of file this job produces. The old
      # assertion used git alone and would have reported a clean checkout no matter how
      # much build output was left in `target/`.
      - name: Snapshot the checkout before anything is generated
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o -type f -print | sort > "${RUNNER_TEMP}/tree-before.txt"
          wc -l < "${RUNNER_TEMP}/tree-before.txt"

      # POSITIVE CONTROL for that assertion. A detector nobody has seen fire is a detector
      # nobody has evidence about — and this one replaced a detector that could not fire at
      # all. Plants a file in an IGNORED directory, confirms the comparison catches it, and
      # removes it. If this step ever passes silently, the final assertion means nothing.
      - name: Prove the cleanliness detector can detect an ignored generated file
        run: |
          set -euo pipefail
          mkdir -p target
          touch target/planted-by-the-positive-control
          find . -path ./.git -prune -o -type f -print | sort > "${RUNNER_TEMP}/tree-probe.txt"
          if diff -q "${RUNNER_TEMP}/tree-before.txt" "${RUNNER_TEMP}/tree-probe.txt" > /dev/null; then
            echo "the cleanliness detector did NOT see a planted file in an ignored" >&2
            echo "directory, so the assertion at the end of this job proves nothing" >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "unexpected: git reported the planted file, so target/ is not ignored" >&2
            exit 1
          fi
          echo "detector fires on an ignored generated file that git cannot see"
          rm -rf target/planted-by-the-positive-control
          rmdir target 2>/dev/null || true

      # `--locked` fails if Cargo.lock is stale. A release built from an unlocked
      # resolution is a release nobody can reproduce.
      - name: Validate the workspace against the committed lockfile
        run: cargo metadata --locked --format-version 1 > /dev/null

      # Reviewed by a human against the RELEASING.md §3 rejection list. Recorded as an
      # artifact so the review has something durable to point at.
      - name: List the exact file set that would ship
        run: |
          set -euo pipefail
          mkdir -p "$REHEARSAL_DIR"
          for crate in $CRATES; do
            cargo package -p "$crate" --list \
              | tee "${REHEARSAL_DIR}/${crate}-package-list.txt"
          done

      # POSITIVE CONTROL. `xtask` is `publish = false`, so the workspace commands must exclude
      # it. Asserting that the file-set listing produced exactly one file per publishable crate
      # and NONE for xtask turns "we think it is excluded" into a checked fact — and would catch
      # a future manifest edit that made the verification runner shippable.
      - name: Assert the publishable set is exactly the intended crates
        run: |
          set -euo pipefail
          # `printf '%s\n' $CRATES` relied on unquoted word splitting to put one crate per
          # line (SC2086). Simply quoting it would emit the whole list as ONE line, so the
          # sorted comparison below would still "pass" while comparing something else — the
          # weakening this fix exists to avoid. `read -ra` splits deliberately instead.
          read -ra crate_list <<< "$CRATES"
          expected=$(printf '%s\n' "${crate_list[@]}" | sort | tr '\n' ' ')
          actual=$(cargo metadata --locked --format-version 1 \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); ids=set(m["workspace_members"]);
          print(" ".join(sorted(p["name"] for p in m["packages"]
                if p["id"] in ids and p.get("publish") != [])))' )
          actual="${actual} "
          echo "expected: ${expected}"
          echo "actual:   ${actual}"
          if [ "$expected" != "$actual" ]; then
            echo "publishable set changed — update CRATES or the manifest that changed" >&2
            exit 1
          fi
          if printf '%s' "$actual" | grep -qw xtask; then
            echo "xtask became publishable; it is internal tooling and must not ship" >&2
            exit 1
          fi
          echo "publishable set matches, and xtask is excluded"

      - name: Build the package archives
        run: cargo package --workspace

      # The full publish verification path with the upload removed. Everything the registry
      # would reject locally is rejected here instead.
      #
      # `--workspace`, never `-p renvor`: the facade depends on crates that are not on the
      # registry, so the single-crate form cannot resolve them. See the CRATES comment above.
      - name: Publish dry run
        run: cargo publish --dry-run --workspace

      # cargo-cyclonedx writes a BOM adjacent to EVERY Cargo.toml in the workspace, not
      # only the one named by --manifest-path. It therefore also emits one beside
      # `xtask`, which is never published and whose SBOM would be meaningless here. Only
      # the publishable crate's SBOM is kept; strays are removed.
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          cargo cyclonedx \
            --manifest-path "crates/${FACADE}/Cargo.toml" \
            --format json \
            --spec-version 1.5 \
            --all \
            --override-filename "${FACADE}-sbom"
          mv "crates/${FACADE}/${FACADE}-sbom.json" "${REHEARSAL_DIR}/"
          find . -name "${FACADE}-sbom.json" -delete

      # An SBOM nobody parses is a file, not evidence. This catches a silent tool change
      # that starts emitting a different format or spec version.
      - name: Validate the SBOM
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ["REHEARSAL_DIR"], os.environ["FACADE"] + "-sbom.json")
          with open(path, encoding="utf-8") as handle:
              bom = json.load(handle)
          assert bom["bomFormat"] == "CycloneDX", bom.get("bomFormat")
          assert bom["specVersion"] == "1.5", bom["specVersion"]
          subject = bom.get("metadata", {}).get("component", {})
          assert subject.get("name") == os.environ["FACADE"], subject.get("name")
          print("bomFormat", bom["bomFormat"], "specVersion", bom["specVersion"])
          print("subject", subject.get("name"), subject.get("version"))
          print("components", len(bom.get("components", [])))
          PY

      # Collected from CARGO_TARGET_DIR, which is outside the checkout — so this is a copy
      # between two temporary directories rather than an extraction from the source tree.
      - name: Collect artifacts and checksums
        run: |
          set -euo pipefail
          cp "${CARGO_TARGET_DIR}/package/"*.crate "${REHEARSAL_DIR}/"
          cd "$REHEARSAL_DIR"
          sha256sum ./*.crate ./*-package-list.txt ./*-sbom.json > SHA256SUMS
          cat SHA256SUMS

      # Nothing above may write into the checkout. If something did, the release would be
      # built from a tree that no longer matches the commit under review.
      #
      # TWO checks, because each is blind to what the other sees:
      #
      #   * the file-listing diff catches CREATED or DELETED files, including ones inside
      #     ignored directories — proven capable of that by the positive control above;
      #   * `git status --porcelain` catches MODIFIED content in tracked files, which a
      #     listing that compares only paths cannot see.
      #
      # The old version of this step ran the second alone and described it as proof that no
      # generated file reached the source tree. It was not: it could not have seen one.
      - name: Assert the checkout is unmodified
        run: |
          set -euo pipefail
          find . -path ./.git -prune -o -type f -print | sort > "${RUNNER_TEMP}/tree-after.txt"
          if ! diff -u "${RUNNER_TEMP}/tree-before.txt" "${RUNNER_TEMP}/tree-after.txt"; then
            echo "the rehearsal created or removed files in the source tree (diff above)" >&2
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "the rehearsal modified tracked files:" >&2
            git status --porcelain >&2
            exit 1
          fi
          echo "checkout unchanged: no generated file reached the source tree, ignored or not"

      # 90 days is the platform maximum for public repositories and matches
      # governance/evidence-retention-policy.md clause 1. These artifacts are evidence
      # TRANSPORT, not the durable archive — clause 2.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rehearsal
          path: ${{ env.REHEARSAL_DIR }}
          retention-days: 90
          if-no-files-found: error

  attest:
    name: attest rehearsal artifacts
    needs: rehearse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Attestations from a pull_request event would run with a read-only token and fail.
    # Skipping is honest; granting more permission to make it succeed would not be.
    if: github.event_name == 'workflow_dispatch'
    # The documented minimum for actions/attest-*. Deliberately NOT `contents: write` and
    # NOT `packages: write` — neither is needed, and either would give this workflow a
    # publishing capability it must never have.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-rehearsal
          path: rehearsal

      # Provenance over the archive, the checksum file, and the package list: what a real
      # release would attest, minus the release.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            rehearsal/*.crate
            rehearsal/SHA256SUMS
            rehearsal/*-package-list.txt

      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: rehearsal/*.crate
          sbom-path: rehearsal/renvor-sbom.json
