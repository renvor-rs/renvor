# Verification on both supported toolchains.
#
# This workflow runs ONE command: `cargo xtask verify`. It deliberately does not
# reimplement the individual steps. Duplicated shell steps here would drift from what
# contributors run locally, and drift is how a skipped check gets reported as a pass.
#
# `cargo xtask verify` probes for every tool it needs and exits 2 if any is missing, so
# every tool the sequence uses must be installed below or the job fails closed.

name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege at the top level. No job elevates it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Produces the required checks `verify (1.94.0)` and `verify (stable)`.
    runs-on: ubuntu-latest
    # 45, not 30, since this job gained real databases. Measured locally, the suites that were
    # previously skipping add roughly two minutes of test time on top of pulling two images. The
    # old ceiling would probably have held; a timeout is an expensive and uninformative way to find
    # out that it did not, and it matches what the `platform` job already allows.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Both matrix jobs run the same link check against the same host. In parallel they
      # compete for github.com's connection budget from a single runner egress address,
      # which is how one job hit HTTP/2 stream resets while the other passed on the same
      # commit. Serialising them costs wall-clock and buys a deterministic result.
      max-parallel: 1
      # ONE DIMENSION, AND IT STAYS ONE DIMENSION.
      #
      # The engine pair is chosen from the toolchain inside the step below rather than added here
      # as extra matrix keys. That is not a style preference — the comment above about `os` says
      # exactly why, and this job proved it the hard way: adding `postgres` and `mysql` keys
      # renamed the required contexts to
      # `verify (1.94.0, postgres:17.11-trixie, mysql:8.4.11)`, so the branch protection rule that
      # requires `verify (1.94.0)` by name was left waiting on a context that no longer existed —
      # silently satisfied by nothing. Observed on PR #34 before it could do any harm.
      #
      # Anything that varies per leg belongs in the step, not in the matrix.
      matrix:
        toolchain: ["1.94.0", "stable"]
    steps:
      # Full history: verification step 7 scans every commit, and a shallow clone
      # would silently scan only the tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy


      # No build cache action is used. The obvious candidate is LGPL-3.0 licensed, which
      # is not on the deny.toml allow-list, and dependency review correctly rejected it.
      # Widening the licence policy to obtain a build cache would weaken a control to buy
      # convenience, so the cache was dropped instead.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: cargo-deny,lychee

      # gitleaks is installed from a pinned release and the archive checksum is
      # verified before extraction. An unverified download in the job that performs
      # secret scanning would undermine the check it exists to run.
      - name: Install gitleaks 8.30.1
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      # GITHUB_TOKEN is lychee's documented environment interface for `--github-token`.
      # With it, a github.com link whose plain HTTP request fails is re-checked through the
      # GitHub API, so a transport-level fault no longer decides whether a link is "broken".
      # The fallback resolves repository URLs only — a URL naming a path inside a repository
      # is still judged by its HTTP response, which is why the per-host limits in
      # lychee.toml carry the actual determinism.
      #
      # This is the run's built-in installation token, scoped by the workflow-level
      # `contents: read` above; it is not a stored secret and grants nothing beyond reading
      # this repository. lychee holds it as a secret value and does not print it.
      # ── THE REAL DATABASES ──────────────────────────────────────────────────────────────
      #
      # THIS STEP DID NOT EXIST, AND ITS ABSENCE MADE THE DATABASE SUITE DECORATIVE.
      #
      # `support::url` returns `None` when its variable is unset, the test returns early, and
      # `libtest` swallows the printed `SKIPPED` line for a passing test unless `--nocapture` is
      # given — which nothing here passes. Neither URL was set anywhere in this repository, so
      # every real-database test reported `ok` having connected to nothing. A revert of the
      # migration-on-boot fix would have gone green through this job.
      #
      # `RENVOR_TEST_REQUIRE_DATABASE` closes it from the other side: with it set, a missing URL
      # is a FAILURE rather than a skip. Deleting this step therefore breaks the build loudly
      # instead of quietly restoring the gap.
      #
      # # Why `docker run` rather than `services:`
      #
      # A service container's `env:` must be a literal or a repository secret, so the password
      # would have to be committed. `.gitleaks.toml` requires every allowlist entry to be narrow
      # and individually justified, and "we committed a password because the syntax made us" is
      # not a justification. Generating one per run and masking it costs six lines and commits
      # nothing.
      - name: Start the real databases
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"

          # The two legs run DIFFERENT engines, so between them they cover all four versions
          # Phase 006 claims rather than testing one pair twice. Chosen here rather than in the
          # matrix, so the required check names stay `verify (1.94.0)` and `verify (stable)`.
          if [ "${{ matrix.toolchain }}" = "1.94.0" ]; then
            postgres_image="postgres:17.11-trixie"
            mysql_image="mysql:8.4.11"
          else
            postgres_image="postgres:18.6-trixie"
            mysql_image="mysql:9.7.2"
          fi
          echo "postgres=$postgres_image mysql=$mysql_image"

          docker run -d --name rv-postgres \
            -e POSTGRES_PASSWORD="$password" -e POSTGRES_DB=renvor_test \
            -p 5432:5432 "$postgres_image"
          # `MYSQL_ROOT_HOST=%` is the image's own default and is set explicitly because the
          # tests connect as root over TCP. The GENERATED profile does the opposite —
          # `MYSQL_ROOT_HOST: localhost` — and the two are not in tension: this is an ephemeral
          # container on a throwaway runner with a per-run password that is never written down,
          # whereas a developer's container has an application user and no reason to expose root.
          docker run -d --name rv-mysql \
            -e MYSQL_ROOT_PASSWORD="$password" -e MYSQL_DATABASE=renvor_test \
            -e MYSQL_ROOT_HOST='%' \
            -p 3306:3306 "$mysql_image"

          # Polled to a deadline rather than slept at. Both probes need no credentials, so
          # neither can warm MySQL's password cache and hide an authentication problem.
          for _ in $(seq 1 60); do
            docker exec rv-postgres pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec rv-postgres pg_isready -U postgres
          for _ in $(seq 1 60); do
            docker exec rv-mysql mysqladmin ping --silent >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec rv-mysql mysqladmin ping --silent

          {
            echo "RENVOR_TEST_POSTGRES_URL=postgres://postgres:$password@127.0.0.1:5432/renvor_test"
            echo "RENVOR_TEST_MYSQL_URL=mysql://root:$password@127.0.0.1:3306/renvor_test"
            echo "RENVOR_TEST_REQUIRE_DATABASE=1"
          } >> "$GITHUB_ENV"

      - name: cargo xtask verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo xtask verify

      # Named separately so a failure here is not mistaken for a verification failure.
      - name: Stop the real databases
        if: always()
        run: docker rm -f rv-postgres rv-mysql || true

  platform:
    # Produces `platform (macos-latest, 1.94.0)`, `platform (macos-latest, stable)`,
    # `platform (windows-latest, 1.94.0)`, and `platform (windows-latest, stable)`.
    #
    # A SEPARATE job, deliberately. The `verify` job above produces the two required status
    # contexts `verify (1.94.0)` and `verify (stable)`; adding an `os` dimension to its matrix
    # would have renamed them to `verify (ubuntu-latest, 1.94.0)` and silently emptied the
    # branch protection rule, which checks contexts by name. Nothing here touches that job.
    #
    # # Why this job exists at all
    #
    # SUPPORT.md said macOS and Windows were "not yet claimed" because "no platform-sensitive
    # code exists to verify". That stopped being true during Phase 002 and nobody noticed:
    # the configuration layer resolves filesystem paths, refuses non-regular files by type,
    # reads `OsString` environment names that are WTF-8 on Windows and arbitrary bytes on unix,
    # and opens files with platform-specific flags. Those are the parts most likely to differ,
    # and they were being verified on exactly one platform.
    #
    # # Why not `cargo xtask verify`
    #
    # The verification sequence includes gitleaks, lychee, and a commit-history scan — tools
    # and checks that are properties of the repository, not of the platform, and running them
    # three times would triple a link check against github.com to learn nothing. This job runs
    # the parts whose behaviour can actually differ per platform.
    name: platform
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        toolchain: ["1.94.0", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ matrix.toolchain }}

      # Serial, matching the Linux run. Several suites assert on process-wide state — the
      # tracing global subscriber has exactly one owner, and the readiness ceiling is
      # per-application but observable across tests in one binary — so a parallel run is
      # testing a different thing from the one the evidence describes.
      #
      # # THE REAL-DATABASE SUITES SKIP HERE, AND THAT IS STATED RATHER THAN SILENT
      #
      # `RENVOR_TEST_REQUIRE_DATABASE` is deliberately NOT set on this job, so a missing database
      # is a skip rather than a failure. macOS runners have no container daemon and Windows
      # runners cannot run Linux containers, so there is nowhere to start PostgreSQL or MySQL.
      #
      # What this job is FOR is the platform-sensitive code — path resolution, `OsString`
      # handling that is WTF-8 on Windows and arbitrary bytes on unix, and file-opening flags.
      # None of that is database code. The real-database claim rests on the `verify` job above,
      # which sets the variable and therefore fails closed.
      #
      # Said plainly: **this job does not verify the database adapter on macOS or Windows, and
      # `SUPPORT.md` should not be read as claiming it does.**
      - name: Workspace tests
        run: cargo test --workspace --all-features -- --test-threads=1

      # FR-034: the facade must build with no default features on every claimed platform, not
      # only on the one where the feature graph was designed.
      - name: No default features
        run: cargo check -p renvor --no-default-features --all-targets
