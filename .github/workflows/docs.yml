# Documentation site build and link check.
#
# This workflow BUILDS and VERIFIES. It does not deploy: the production documentation
# site is a separate repository and a separate approval gate (PLAN.md Section 26).
# `pages: write` and `id-token: write` are therefore not granted anywhere in this file.
# They are added only when a deploy job actually exists, scoped to that job alone.

name: docs

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    # Produces the required check `docs`.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - uses: taiki-e/install-action@7f4eb899022d8fe70b20c4f3de697aa85c309026 # v2.85.11
        with:
          tool: lychee

      # The documentation cross-reference check is NOT duplicated here.
      #
      # It ran as a workflow-only step until 2026-08-20, which meant `cargo xtask verify` could
      # pass locally on a tree this job would reject — the exact local/automation divergence
      # `contracts/verification-sequence.md` opens by forbidding. It is now step 11 of that
      # sequence, and the `verify` jobs in `ci.yml` invoke the sequence, so CI exercises the
      # xtask-owned gate rather than a copy of it that can drift.


      # `npm ci`, never `npm install`: the committed lockfile is the input, and a
      # resolution that differs from it is a failure rather than a convenience.
      - name: Build documentation site
        working-directory: docs
        run: |
          npm ci
          npm run build

      # The image-input guard is the ONLY control that can fail a build over an image:
      # the vendored image-size replacement throws, but mdx-loader catches that and
      # continues, so a bypass ships a dimensionless image in a build reporting success
      # (measured; see ADR-0009). The build step above exercises only the guard's passing
      # path, where a guard broken to always exit 0 is indistinguishable from a working
      # one. These controls plant each caught form and require a refusal.
      - name: Image-input guard controls
        working-directory: docs
        run: npm run test:image-inputs

      # npm-side advisory gate. cargo-deny covers Rust only, and dependency-review runs
      # on pull_request alone, so before this step a newly published advisory against any
      # npm dependency reached no gate at all. `moderate` rather than `high` because
      # governance/dependency-advisory-policy.md requires a written, time-bounded
      # exception even at Medium.
      - name: npm advisories
        working-directory: docs
        run: npm audit --audit-level=moderate

      # --root-dir is required. The built site uses root-relative links, and without
      # it every internal link resolves as broken against the local filesystem.
      - name: Link check
        run: lychee --no-progress --require-https --config lychee.toml --root-dir "$GITHUB_WORKSPACE/docs/build" docs/build
