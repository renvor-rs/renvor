name: Bug report
description: Something behaves differently from what the documentation states.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report a security vulnerability here.** Public issues are visible to
        everyone, including anyone who would exploit the report. Use the private path
        in [SECURITY.md](https://github.com/renvor-rs/renvor/blob/main/SECURITY.md).

        Renvor is pre-release and unpublished, but it is no longer documentation only:
        Phase 002 landed a working transport-independent kernel — application lifecycle,
        provider resolution, layered configuration, health, and a failure-injection
        harness. It has **no transport**, so it can start and stop an application but
        cannot serve anything. Reports about kernel behaviour are in scope, as are
        reports about the documentation, governance, or the verification sequence.

        Every API is explicitly unstable (FR-036), so "this changed" is expected and is
        not by itself a bug.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands, in order. A partial reproduction is better than none.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.0.0, or a commit SHA"
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Rust toolchain
      description: Output of `rustc --version`. The supported floor is 1.94.0.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: >-
        Linux, macOS, and Windows are supported. See contracts/support-policy.md — the
        normative policy — for what each claim rests on, and which contexts are required.
    validations:
      required: true
