# Renvor — Gitleaks configuration
#
# Satisfies: spec FR-025 (secret scanning gates), tasks T013 and T053.
#
# POLICY: allowlist entries MUST be narrow and individually justified. Broad path
# exclusions, whole-rule disables, and directory-wide suppressions defeat the control
# and are not acceptable (Phase 001 tasks T013, which permits documented false positives:
# https://github.com/renvor-rs/renvor/blob/01327b1ee61b73ebbd4f9198c04d651b38367ba8/specs/001-governance-foundation/tasks.md).
#
# Every entry below must state: the rule, the exact location, why the match is not a
# secret, and what would make the entry removable.

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# FP-001 — prose in a superseded planning document
# ---------------------------------------------------------------------------
# Rule        : generic-api-key
# Location    : RENVOR_MASTER_IMPLEMENTATION_PLAN.md line 679
# Fingerprint : RENVOR_MASTER_IMPLEMENTATION_PLAN.md:generic-api-key:679
# Entropy     : 3.73
#
# The flagged text is an English sentence listing documentation deliverables:
#   "... hardening checklist, secrets, CORS/proxies/rate limits and ecommerce ..."
# The rule keys off the keyword "secrets" followed by the next token. No credential,
# key, or token is present. Verified by reading the line in context (672-686).
#
# Additional context — this is not published material:
#   * the file is ignored (.gitignore line 68) and untracked
#   * it appears in 0 commits, so the git-history scan never sees it
#   * T009 excludes it from the publish set as superseded by PLAN.md
#
# Scope: matched CONTENT only — the literal prose phrase. Deliberately no `paths`
# entry: a `paths` allowlist makes gitleaks skip the whole file before scanning it,
# which is a blanket file exclusion and would hide any real secret added to that file
# later. That was verified empirically — a `paths` form of this entry caused
# `scanned ~0 bytes` and let an injected canary secret through undetected.
#
# Verification: with this entry active, injecting a canary credential into the same
# file three lines below is still detected, while this prose match stays suppressed.
# Re-run that check after any edit to this file (see governance/phase-001-evidence.md).
#
# Removable when: RENVOR_MASTER_IMPLEMENTATION_PLAN.md is deleted from the working
# tree, at which point this entry MUST be deleted with it.
[[allowlists]]
description = "FP-001: prose 'secrets, CORS/proxies/rate ...' in superseded, untracked RENVOR_MASTER_IMPLEMENTATION_PLAN.md line 679"
regexes = ['''secrets, CORS/proxies/rate''']
regexTarget = "match"

# ---------------------------------------------------------------------------
# FP-002 — rustdoc's generated search index
# ---------------------------------------------------------------------------
# Rule        : square-access-token
# Location    : target/doc/search.index/<content-hash>.js line 1
# Match       : EAAAar4AAADzDSAAAPPwHjDQAA
#
# `cargo doc` writes a compressed, base64-encoded search index. One chunk of it begins
# `EAAA`, which is the literal prefix the Square access-token rule keys on, followed by
# enough base64 to satisfy the rest of the pattern. No credential exists: the bytes are a
# serialised search table, regenerated with different contents on every `cargo doc` run.
#
# WHY THIS ONE IS SCOPED BY PATH WHEN FP-001 REFUSED TO BE
#
# FP-001 deliberately uses a CONTENT regex and explicitly rejects a `paths` entry, because
# a path allowlist over a real file makes gitleaks skip it before scanning and would hide a
# genuine secret added to that file later. That reasoning is correct, and it does not carry
# over here — for reasons that are properties of `target/`, not preferences:
#
#   * `target/` is ignored by tracked `.gitignore` line 10 and appears in 0 commits, so no
#     secret can persist there as repository content;
#   * a content regex is impossible — the blob's bytes AND its file name (a content hash)
#     both change on every build, so any literal would stop matching and the entry would
#     silently expire into uselessness, which is worse than no entry;
#   * committed history is covered by a DIFFERENT scanner in the same step
#     (`gitleaks git`), which this entry does not touch.
#
# WHY THIS WAS FIXED RATHER THAN RE-RUN
#
# The working-tree scan reads build output, so its verdict depended on what had been
# compiled. `cargo xtask verify` PASSED this step and then FAILED it on a second
# consecutive run over the same unchanged tree, once a second toolchain's `cargo doc` had
# populated `target/doc`. Measured: 190 MB, 301 MB and 376 MB scanned all clean; 531 MB
# scanned reports this finding. A gate whose verdict depends on build state is not a gate,
# and re-running until it passed would have buried that.
#
# Verification, performed 2026-08-23, to be repeated after any edit to this file:
#   1. a canary AWS key and secret in an untracked `canary_check.rs` at the repository root
#      IS still reported (`aws-access-token`) with this entry active;
#   2. the same canary placed under `target/` is NOT reported — the entry doing exactly its
#      job and nothing wider;
#   3. `AKIAIOSFODNN7EXAMPLE` is NOT a usable canary: it is AWS's own documentation example
#      and gitleaks allowlists it by default. Recorded because it produced a false
#      "detection works" reading on the first attempt here.
#
# Removable when: the working-tree scan stops reading generated build output — either
# gitleaks honours `.gitignore` in `dir` mode, or the step scans an explicit file list from
# git rather than a directory.
[[allowlists]]
description = "FP-002: rustdoc's generated search index under target/, which is gitignored build output and is never committed"
paths = ['''^target/''']

# ---------------------------------------------------------------------------
# FP-003 — the synthetic opaque-token fixture in the auth transport's test application
# ---------------------------------------------------------------------------
# Rule        : generic-api-key
# Location    : crates/renvor-auth-http/tests/test_application.rs, two occurrences
# Fingerprint : 2ab05ae7b84d…:crates/renvor-auth-http/tests/test_application.rs:generic-api-key
# Entropy     : 4.00 — the MAXIMUM a 64-character hex string can score, and the reason
#               the rule fires. Every one of the sixteen nibbles appears exactly four
#               times, which is what a uniform distribution looks like to a Shannon
#               calculation and what a keyboard walk looks like to a human.
#
# The flagged value is `0123456789abcdef` repeated four times, posted as the `token`
# member of a password-reset and a verification-completion request body:
#   {"token":"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"}
# The rule keys off `token":"` followed by 64 hex characters. It is a placeholder that
# the test expects to be REFUSED — both assertions require a 4xx — so it is not merely
# not a credential, it is a value the system under test is proven to reject.
#
# Why an allowlist rather than a different fixture: the match is in committed history
# (`2ab05ae`, batch J), so `gitleaks git .` re-reads it on every run regardless of what
# the working tree says today. Changing the literal now would silence the working-tree
# scan and leave the history scan reporting two findings forever. The only alternatives
# are rewriting published history or suppressing the match, and suppression is narrower.
#
# Scope: matched CONTENT only — the literal repeated-nibble string. Deliberately no
# `paths` entry, for the reason FP-001 records and proved empirically: a `paths`
# allowlist makes gitleaks skip the file before scanning it, which would hide any real
# credential added to this test application later. This test application is exactly the
# file where a real credential is most likely to be pasted by accident.
#
# Verification: with this entry active, a canary credential injected into the same file
# is still detected, and both scans report the two fixture matches suppressed.
#
# Removable when: the reset and verification-completion cases stop posting a literal
# token — for example if the test application starts minting the token through the
# repository it is testing — AND the commits carrying the literal have left the scanned
# history. Deleting the fixture alone is not sufficient.
[[allowlists]]
description = "FP-003: synthetic '0123456789abcdef'x4 opaque-token fixture in renvor-auth-http's test application, which the test requires to be refused"
regexes = ['''0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef''']
regexTarget = "match"
