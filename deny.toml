# cargo-deny policy — the AUTHORITATIVE machine-readable licence policy (FR-020).
#
# `CONTRIBUTING.md` points here rather than restating the allow-list in prose, because
# a prose copy drifts from the enforced one and reviewers then trust the wrong list.
#
# Verification step 6 runs `cargo deny check`, covering all four sections below.
# Enforced by research Finding 4.

[graph]
# Check every target and every feature. A dependency that is licence-incompatible only
# on Windows, or only behind an optional feature, is still licence-incompatible.
all-features = true

[advisories]
version = 2
# No ignored advisories.
#
# Response windows cannot be expressed in this file, so they are authoritative in
# governance/dependency-advisory-policy.md: triage within 24h (active exploitation or
# Critical), 48h (High), 5d (Medium), 10d (Low); remediate within 7d (Critical), 14d (High),
# 30d (Medium), 90d or next prerelease (Low). Absence of an upstream fix does not extend a
# deadline, and Critical/High cannot be waived for a public release.
#
# An identifier added below without a dated advisory record satisfying that policy is a
# policy violation, not a configuration choice.
ignore = []
unmaintained = "workspace"
yanked = "deny"

# NOTE: the section key is the American spelling `licenses` — it is cargo-deny's
# schema, not prose, and the tool rejects `licences` outright.
[licenses]
version = 2
confidence-threshold = 0.93

# Permissive licences compatible with distributing under `MIT OR Apache-2.0`.
# Adding to this list is a policy change and goes through pull request review.
#
# `MIT-0` added 2026-08-23 (Phase 005). It is MIT **without the attribution requirement** — strictly
# more permissive than `MIT`, which is already allowed — and OSI-approved. Nothing that is
# compatible under `MIT` becomes incompatible under `MIT-0`.
#
# It arrived through `borrow-or-share` 0.2.4, a transitive DEV-only dependency:
#
#   jsonschema (dev) -> referencing -> fluent-uri -> borrow-or-share  [MIT-0]
#
# It is therefore never distributed in any published crate; it exists only in the build
# environment. The allowance is recorded anyway, because a licence that is fine for a reason
# nobody wrote down is a licence somebody will re-litigate.
#
# HOW IT WAS FOUND, and why that matters: `cargo deny check` did NOT see it. GitHub's
# dependency-review action did, and failed the pull request. The two gates inspect different
# graphs — `cargo deny list` here reports `schemars` (a runtime dependency) and reports neither
# `jsonschema`, `proptest`, `fluent-uri`, `referencing`, nor `borrow-or-share`, all of which are
# dev-only. That gap is recorded in governance/deferred-verification-work.md: a local gate narrower
# than the CI gate it is supposed to pre-empt is a gate that reports a pass it has not earned.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

# Per-crate exceptions. Empty by design: an exception is a reviewed decision that
# names the crate and the reason, never a blanket widening of `allow`.
exceptions = []

[bans]
# Duplicate versions are a warning, not an error. They are usually imposed by
# transitive dependencies and outside this project's control; failing on them would
# make the gate unactionable and invite pressure to weaken it.
multiple-versions = "warn"
# A wildcard requirement means "whatever resolves today", which is the unreviewed
# floating update FR-020 prohibits.
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
# crates.io only. An unknown registry or a git dependency bypasses the registry's
# immutability guarantee and the audit trail that comes with it.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
